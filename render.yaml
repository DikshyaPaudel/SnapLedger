services:
  - type: web
    name: snapledger-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: JOB_BACKEND
        value: inline
      - key: DATABASE_URL
        fromDatabase:
          name: snapledger-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false   # set manually in the Render dashboard -- never commit real API keys

databases:
  - name: snapledger-db
    plan: free